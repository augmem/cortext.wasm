name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No oversize binaries committed
        run: |
          set -euo pipefail
          found="$(find . -type f -size +95M -not -path './.git/*' | head || true)"
          if [[ -n "$found" ]]; then
            echo "Files over GitHub soft limit:"
            echo "$found"
            exit 1
          fi
          if find assets -type f \( -name 'cortext.wasm' -o -name 'cortext.js' \) 2>/dev/null | grep -q .; then
            echo "assets/cortext.{js,wasm} must not be committed; vendor in CI / prepublish instead"
            find assets -type f \( -name 'cortext.wasm' -o -name 'cortext.js' \)
            exit 1
          fi
          if [[ -f assets/.vendor-source ]]; then
            if grep -E '(/Users/|/home/|[A-Za-z]:\\)' assets/.vendor-source; then
              echo "assets/.vendor-source must not contain absolute local paths"
              exit 1
            fi
          fi
          echo "source-check ok (CI proves package layout + unit tests; full browser WASM E2E is out of scope)"

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and unit tests
        run: npm run test:unit

      - name: Optional WASM smoke
        run: |
          set -euo pipefail
          # Prefer sibling monorepo artifact when CI has a multi-checkout layout.
          if [[ -d ../cortext/build-wasm/dist/wasm ]]; then
            npm run vendor:wasm -- --force || true
          fi
          node scripts/check-wasm.mjs --optional
          if [[ -f assets/cortext.wasm && -f assets/cortext.js ]]; then
            npm run build
            node --test tests/smoke.test.mjs
          else
            echo "No WASM assets present; smoke skipped"
          fi

  # Live engine tests: the WASM built from the ENGINE_VERSION tag of
  # cortext.cpp, with the models from that release's asset tarball.
  engine-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read engine version
        id: engine
        run: echo "version=$(tr -d '[:space:]' < ENGINE_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: augmem/cortext.cpp
          ref: v${{ steps.engine.outputs.version }}
          path: engine

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache assembled models
        id: models
        uses: actions/cache@v4
        with:
          path: models
          key: cortext-models-${{ steps.engine.outputs.version }}

      - name: Assemble models from the engine release
        if: steps.models.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.engine.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engine-assets"
          cd "$RUNNER_TEMP/engine-assets"
          gh release download "v$VERSION" -R augmem/cortext.cpp \
            -p "cortext-assets-$VERSION.tar.gz" -p "cortext-assets-$VERSION.tar.gz.sha256"
          sha256sum -c "cortext-assets-$VERSION.tar.gz.sha256"
          tar xzf "cortext-assets-$VERSION.tar.gz" models
          cd "$GITHUB_WORKSPACE"
          node scripts/assemble-models.mjs "$RUNNER_TEMP/engine-assets/models" models

      - name: Build engine WASM (plain and model-preloaded)
        working-directory: engine
        run: |
          set -euo pipefail
          cmake --preset wasm
          cmake --build --preset wasm -j 4
          cmake --preset wasm -B build-wasm-preload \
            -DCORTEXT_WASM_PRELOAD_MODEL_ASSETS_DIR="$GITHUB_WORKSPACE/models"
          cmake --build build-wasm-preload --target cortext_wasm -j 4

      - name: Install and build
        run: |
          npm ci
          npm run vendor:wasm -- --from engine/build-wasm/dist/wasm --force
          node scripts/check-wasm.mjs
          npm run build

      - name: Live engine tests (required)
        env:
          CORTEXT_WASM_REQUIRE_ENGINE: "1"
          CORTEXT_AIST_MODEL_PATH: ${{ github.workspace }}/models/AIST-87M-GGUF/AIST-87M_q8_0.gguf
          CORTEXT_LI_MODEL_PATH: ${{ github.workspace }}/models/AIST-87M-GGUF/AIST-87M-LI.gguf
          CORTEXT_WASM_PRELOAD_DIST: ${{ github.workspace }}/engine/build-wasm-preload/dist/wasm
        run: node --test tests/*.test.mjs
